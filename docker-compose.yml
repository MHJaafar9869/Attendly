services:
    app:
        container_name: attendly-app
        env_file: .env.docker
        environment:
            GENERATE_ENV: ${GENERATE_ENV:-true}
            AUTO_FRESH_MIGRATIONS: ${AUTO_FRESH_MIGRATIONS:-true}
        build:
            context: .
            dockerfile: Dockerfile
            args:
                USER_ID: ${HOST_UID:-1000}
                GROUP_ID: ${HOST_GID:-1000}
        user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
        image: attendly/laravel-frankenphp
        ports:
            - "${APP_PORT:-81}:80"
            - "${VITE_PORT:-5173}:5173"
        volumes:
              # Core Application Files (Bind Mounts)
              - ./app:/var/www/html/app
              - ./resources:/var/www/html/resources
              - ./routes:/var/www/html/routes
              - ./database:/var/www/html/database
              - ./public:/var/www/html/public
              - ./bootstrap:/var/www/html/bootstrap
              - ./Modules:/var/www/html/Modules
              - .env.docker:/var/www/html/.env

              # Named Volume for Storage (Best practice for performance/permissions)
              - ./storage:/var/www/html/storage

              # Configuration/Scripts (Bind Mounts)
              - ./Docker/entrypoint.sh:/usr/local/bin/entrypoint.sh
              - ./Docker/Caddyfile:/etc/caddy/Caddyfile
        restart: unless-stopped
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - attendly

    mysql:
        container_name: attendly-mysql
        env_file: .env.docker
        image: mysql:8.0
        restart: unless-stopped
        ports:
            - 3307:3306
        environment:
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
        volumes:
            - mysql-data:/var/lib/mysql
            - ./Docker/mysql-init.sh:/docker-entrypoint-initdb.d/init.sh
        networks:
            - attendly
        healthcheck:
          test: ["CMD", "mysql", "-h", "mysql", "-u${DB_USERNAME}", "-p${DB_PASSWORD}", "-D${DB_DATABASE}", "-e", "SELECT 1"]
          interval: 10s
          timeout: 5s
          retries: 5
          start_period: 30s

    redis:
        container_name: attendly-redis
        image: redis:alpine
        restart: unless-stopped
        command: >
          redis-server
          --appendonly yes
          --appendfilename appendonly.aof
          --dir /data
        volumes:
            - redis-data:/data
        networks:
            - attendly
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 5s

    phpmyadmin:
        container_name: attendly-phpmyadmin
        env_file: .env.docker
        image: phpmyadmin/phpmyadmin
        restart: unless-stopped
        ports:
            - 127.0.0.1:${PMA_PORT:-91}:80
        environment:
            PMA_HOST: mysql
            PMA_PORT: 3306
            PMA_DATABASE: ${DB_DATABASE}
            PMA_USER: ${DB_USERNAME}
            PMA_PASSWORD: ${DB_PASSWORD}
            UPLOAD_LIMIT: 100M
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - attendly

networks:
    attendly:
        driver: bridge

volumes:
    mysql-data:
    redis-data:
    storage:
